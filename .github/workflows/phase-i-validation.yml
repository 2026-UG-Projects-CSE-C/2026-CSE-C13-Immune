name: Phase I validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  academic-prototype:
    name: Windows Python 3.12 — demonstrations, tests, and static checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and validation tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -c requirements-lock.txt ".[test]"
          python -m pip install --disable-pip-version-check --no-cache-dir "ruff==0.17.2"
          python -m pip check
      - name: Python tests
        shell: pwsh
        run: python -m pytest -q -p no:cacheprovider
      - name: Ruff lint
        shell: pwsh
        run: python -m ruff check --select E4,E7,E9,F,I src tests
      - name: Ruff formatting check
        shell: pwsh
        run: python -m ruff format --check src tests
      - name: Healthy scenario
        shell: pwsh
        run: |
          $output = python -m immune.demo healthy | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'Verification: PASS' -or $output -notmatch 'Final address: A002' -or $output -notmatch 'Event count: 13') { throw 'Healthy scenario differs from validated evidence.' }
      - name: Expected stale-state failure
        shell: pwsh
        run: |
          $output = python -m immune.demo stale-retrieval | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'Verification: FAIL' -or $output -notmatch 'Event count: 14') { throw 'Stale scenario did not reproduce the expected verification failure.' }
      - name: Explicit REFRESH recovery
        shell: pwsh
        run: |
          $output = python -m immune.demo stale-retrieval --recover | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'Initial verification: FAIL' -or $output -notmatch 'Final verification: PASS' -or $output -notmatch 'Recovered address: A002' -or $output -notmatch 'Event count: 25') { throw 'REFRESH scenario differs from validated evidence.' }
